<div id="auth_google_container" class="page modal-cover flex flex-column flex-center flex-middle" style="font-size:1.0rem; z-index: var(--z-dialog-tool);">
    <div class="auth_google_dialog">
    
        <div class="row" style="height:48px;">
            <div id="BTN_AUTH_GOOGLE_MORE" class="fit-height float-right flex flex-column flex-center flex-middle circle overflow-none pointer" style="width:48px;">
                <span class="material-icons">more_vert</span>
            </div>
        </div>
        
        <div class="row flex flex-column flex-center flex-middle" style="height:100px;">
            <img src="[icon_512]" style="height:80px;">
        </div>

        <div class="row flex flex-column flex-center flex-middle" style="height:80px;">
            <img id="IMG_AUTH_GOOGLE_LOGO" src="[logo]" style="max-height:60px;">
        </div>
        
        <!--title-->
        <div class="row flex flex-column flex-center flex-middle" style="height:40px; font-size:var(--font-size-large); font-weight:var(--font-weight-medium);">
            [title]
        </div>
        <!--title-end-->

        <div id="DIV_TARGET_GOOGLE_LOGIN" class="flex flex-column flex-center flex-middle" style="margin-top:var(--space-large); width:100%; height:80px;"></div>

        <div id="DIV_AUTH_GOOGLE_MENU" class="page" style="display:none;">
            <div class="menu" style="position:absolute; top:48px; right:5px; height:fit-content; width:fit-content; padding:0 var(--space-medium) var(--space-medium) var(--space-medium); max-width:45%; font-size:1.1rem; border-radius:var(--radius-small); box-shadow:var(--box-shadow-small);">
                <div class="menu-item" href="/open/docview/?docid=tos.md">Terms of service</div>
                <div class="menu-item divider" href="/open/docview/?docid=pp.md">Privacy policy</div>
                <div class="menu-item" href="/open/docview/?docid=mit.md">MIT License</div>
            </div>
        </div>
        
    </div>
</div>
