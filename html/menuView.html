
<!--layout-inline-->
<!--end-layout-inline-->

<!--layout-page-->
<div class="popup-container dark flex flex-column flex-center flex-middle">

    <!--disposition-overlay-->
    <div id="DIV_MENU" class="page menu" style="position:relative; border-radius:2px;">
        <div id="DIVTPL_MENU_SEPARATOR" style="display:none">
            <div id="" class="menu-item" style="margin:9px 0 10px 0; height:1px; border-bottom:1px solid var(--border);"></div>
        </div>
        <div id="DIVTPL_MENU_OPTION" style="display:none">
            <div id="[id]" class="menu-item [disabled]" style="height:40px; padding:0 10px;">
                <div class="float-left fit-height flex flex-column flex-center flex-middle" style="width:40px;">
                    [icon]
                </div>
                <div class="float-left fit-height flex flex-row flex-left flex-middle" style="padding:0 10px;">
                    [caption]
                </div>
            </div>
        </div>
        <div id="DIVTPL_MENU_TITLE" style="display:none">
            <div id="" class="flex flex-row flex-left flex-middle menu-item title" style="margin-top:[margin-top]; height:30px; font-size:95%; font-weight:bold; padding:0 10px;">
                [caption]
            </div>
        </div>
    </div>
    <!--end-->

    <!--disposition-center-->
    <div id="DIV_MENU" class="dialog menu shadow-small-light" style="position:relative; border-radius:2px;">
        <div id="DIVTPL_MENU_SEPARATOR" style="display:none">
            <div id="" class="menu-item" style="margin:9px 0 10px 0; height:1px; border-bottom:1px solid var(--border);"></div>
        </div>
        <div id="DIVTPL_MENU_OPTION" style="display:none">
            <div id="[id]" class="menu-item [disabled]" style="height:40px; padding:0 10px;">
                <div class="float-left fit-height flex flex-column flex-center flex-middle" style="width:40px;">
                    [icon]
                </div>
                <div class="float-left fit-height flex flex-row flex-left flex-middle" style="padding:0 10px;">
                    [caption]
                </div>
            </div>
        </div>
        <div id="DIVTPL_MENU_TITLE" style="display:none">
            <div id="" class="flex flex-row flex-left flex-middle menu-item title" style="margin-top:[margin-top]; height:30px; font-size:95%; font-weight:bold; padding:0 10px;">
                [caption]
            </div>
        </div>
    </div>
    <!--end-->

    <!--disposition-context-navigation-->
    <div id="DIV_MENU" class="menu shadow-small-light" style="position:absolute; top:10px; right:10px; min-width:25%;">
        <div id="DIVTPL_MENU_SEPARATOR" style="display:none">
            <div id="" class="menu-item" style="margin:9px 0 10px 0; height:1px; border-bottom:1px solid var(--border);"></div>
        </div>
        <div id="DIVTPL_MENU_OPTION" style="display:none">
            <div id="[id]" class="menu-item [disabled]" style="height:40px; padding:0 10px;">
                <div class="float-left fit-height flex flex-column flex-center flex-middle" style="width:40px;">
                    [icon]
                </div>
                <div class="float-left fit-height flex flex-row flex-left flex-middle" style="padding:0 10px;">
                    [caption]
                </div>
            </div>
        </div>
        <div id="DIVTPL_MENU_TITLE" style="display:none">
            <div id="" class="flex flex-row flex-left flex-middle menu-item title" style="margin-top:[margin-top]; height:30px; font-size:95%; font-weight:bold; padding:0 10px;">
                [caption]
            </div>
        </div>
    </div>
    <!--end-->

</div>
<!--end-layout-page-->
