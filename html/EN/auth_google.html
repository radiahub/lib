<div id="auth_google_container" class="page modal-cover flex flex-column flex-center flex-middle" style="font-size:1.0rem; z-index: var(--z-dialog-tool);">
    <div class="auth_google_dialog">
    
        <div class="row" style="height:48px;">
            <div id="BTN_AUTH_GOOGLE_MORE" class="fit-height float-right flex flex-column flex-center flex-middle circle overflow-none pointer" style="width:48px;">
                <span class="material-icons">more_vert</span>
            </div>
        </div>
        
        <div class="row flex flex-column flex-center flex-middle" style="height:100px;">
            <img src="[icon_512]" style="height:80px;">
        </div>

        <div class="row flex flex-column flex-center flex-middle" style="height:80px;">
            <img id="IMG_AUTH_GOOGLE_LOGO" src="[logo]" style="max-height:60px;">
        </div>
        
        <!--title-->
        <div class="row flex flex-column flex-center flex-middle" style="height:40px; font-size:var(--font-size-large); font-weight:var(--font-weight-medium);">
            [title]
        </div>
        <!--title-end-->
        
        <div class="row" style="margin:var(--space-large) 0; padding:0 var(--space-xl); height:fit-content; font-size:var(--font-size-medium); font-weight:var(--font-weight-normal);">

            <!--message-->
            <p style="text-align:justify;">
                [message]
            </p>
            <!--message-end-->
        </div>

        <div class="flex flex-column flex-center flex-middle" style="margin:var(--space-large) 0; width:100%; height:80px;">
            <div id="DIV_TARGET_GOOGLE_LOGIN" style="width:fit-content; height:fit-content; border:2px solid var(--color-accent); border-radius:6px; box-shadow:var(--box-shadow-small);"></div>
        </div>

        <div class="row" style="margin-top:var(--space-large); padding:0 var(--space-xl); height:fit-content; font-size:var(--font-size-small); font-weight:var(--font-weight-normal); text-align: justify;">
            <p>
                All personal information shared with us is safe and will never be used outside Jaga application, nor shared with any third party.
            </p>
        </div>
        
        <div class="row" style="margin-top:var(--space-large); padding:var(--space-xl) var(--space-xl) 0 var(--space-xl); height:fit-content; font-size:var(--font-size-small); font-weight:var(--font-weight-normal); text-align: justify;">
            <p>
                <span class="dispatcher underline" href="/open/docviewer?doc=/lib/html/tos.html" style="color:var(--color-accent); cursor:pointer;">Terms of service</span>
            </p>
            <p>
                <span class="dispatcher underline" href="/open/docviewer?doc=/lib/html/pp.html" style="color:var(--color-accent); cursor:pointer;">Privacy policy</span>
            </p>
        </div>
        
        <div id="DIV_AUTH_GOOGLE_MENU" class="page" style="display:none;">
            <div class="menu" style="position:absolute; top:48px; right:5px; height:fit-content; width:fit-content; padding:0 var(--space-medium) var(--space-medium) var(--space-medium); max-width:45%; font-size:1.0rem; border-radius:var(--radius-small); box-shadow:var(--box-shadow-small);">
                <div class="menu-item dispatcher" href="/open/docviewer?doc=/lib/html/tos.html">Terms of service</div>
                <div class="menu-item divider dispatcher" href="/open/docviewer?doc=/lib/html/pp.html">Privacy policy</div>
                <div class="menu-item divider dispatcher" href="/open/docviewer?doc=/lib/html/mit.html">MIT License</div>
                <div class="menu-item dispatcher" href="[about_href]">About</div>
            </div>
        </div>
        
    </div>
</div>
